# ============================================================================
# CRM Super CR — Configuración del backend
# ============================================================================

spring.application.name=crm-super-backend
server.port=${PORT:4000}
server.address=0.0.0.0

# ----------------------------------------------------------------------------
# Base de datos (H2 embebida — archivo local, sin instalar nada)
# Los datos se guardan en ./datos/crm_db.mv.db junto al JAR.
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./datos/crm_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,KEY,YEAR,MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----------------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------------------------------------------------------
# Errores / recursos estáticos
# ----------------------------------------------------------------------------
# Las rutas /api/* no encontradas devuelven JSON desde GlobalExceptionHandler.
# Los recursos estáticos (frontend React) se sirven normalmente.
spring.mvc.throw-exception-if-no-handler-found=true

# ----------------------------------------------------------------------------
# Seguridad (JWT)
# ----------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:cambia-este-secreto-en-produccion-cambia-este-secreto}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:12}

# ----------------------------------------------------------------------------
# Datos de prueba (usuarios, productos, tarifas de IVA, etc.)
# ----------------------------------------------------------------------------
# Poner en false una vez que el súper ya tenga usuarios/productos reales
# cargados, para no volver a intentar sembrar datos de ejemplo.
app.seed.enabled=${APP_SEED_ENABLED:true}

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
logging.level.root=INFO
