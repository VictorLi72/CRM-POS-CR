# ============================================================================
# CRM Super CR — Configuración del backend
# ============================================================================

spring.application.name=crm-super-backend
server.port=${PORT:4000}
server.address=0.0.0.0

# ----------------------------------------------------------------------------
# Base de datos (MySQL)
# ----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/crm_super_pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:crm_super}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------------
# ddl-auto=update: las entidades JPA crean/ajustan el esquema solas en el
# primer arranque (backend/src/main/resources/db/schema.sql deja el mismo
# esquema documentado, por si se prefiere crear la base a mano).
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Las fechas se guardan en UTC (ReportService calcula "hoy" en hora de Costa
# Rica restando 6 horas) — sin esto, el driver podría interpretar los
# timestamps con el huso horario del sistema operativo en vez de UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------------------------------------------------------
# Errores / recursos estáticos
# ----------------------------------------------------------------------------
# Sin esto, una ruta no encontrada la resuelve el manejador de recursos
# estáticos de Spring en vez de llegar a GlobalExceptionHandler, y el
# frontend no recibiría el {"error": "Ruta no encontrada"} esperado.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ----------------------------------------------------------------------------
# Seguridad (JWT)
# ----------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:cambia-este-secreto-en-produccion-cambia-este-secreto}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:12}

# ----------------------------------------------------------------------------
# Datos de prueba (usuarios, productos, tarifas de IVA, etc.)
# ----------------------------------------------------------------------------
# Poner en false una vez que el súper ya tenga usuarios/productos reales
# cargados, para no volver a intentar sembrar datos de ejemplo.
app.seed.enabled=${APP_SEED_ENABLED:true}

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
logging.level.root=INFO
